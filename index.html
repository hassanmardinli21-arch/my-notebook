<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الملاحظات السحابي</title>
<style>
:root { --bg: #f4e4bc; --card: #faf0d7; --border: #c9a961; --text: #3e2c1c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', 'Amiri', serif; background: #5d4a35; color: var(--text); padding: 20px; padding-bottom: 100px; }
.container { max-width: 800px; margin: 0 auto; background: var(--bg); padding: 30px; border-radius: 8px; border: 2px solid #a8845a; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
h2 { text-align: center; margin-bottom: 20px; border-bottom: 2px double var(--border); padding-bottom: 15px; }
textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid var(--border); border-radius: 6px; font-family: inherit; background: var(--card); resize: vertical; }
textarea:focus { outline: none; border-color: #8b5a2b; }
#saveBtn { background: #8b5a2b; color: white; width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
.backup-box { display: flex; gap: 10px; margin-top: 15px; }
.backup-btn { flex: 1; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--card); cursor: pointer; font-weight: bold; }
.toggle-index-btn { width: 100%; margin-top: 15px; padding: 10px; background: #3e2c1c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
.notes-list { display: none; margin-top: 15px; border-top: 2px solid var(--border); padding-top: 15px; }
.notes-list.visible { display: block; }
.search-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 6px; font-family: inherit; background: white; }
.note-card { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border); }
.note-card.pinned { border: 2px solid #d4af37; background: #fffdf5; }
.note-header { font-size: 12px; color: #666; margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 5px; }
.note-text { margin-bottom: 12px; white-space: pre-wrap; line-height: 1.6; }
.btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 5px; }
.action-btn { padding: 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: bold; }
.action-btn:hover { background: #eee; }
.delete-btn { color: red; background: #fce4e4; }
.floating { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: #333; padding: 10px; border-radius: 30px; z-index: 999; }
.floating button { width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 18px; cursor: pointer; background: #fff; }
</style>
</head>
<body>

<div class="container">
<h2>دفتر الملاحظات ☁️</h2>
<textarea id="noteInput" placeholder="اكتب ملاحظتك هنا..."></textarea>
<button id="saveBtn">💾 حفظ على السحابة</button>
<p id="status" style="text-align:center; margin-top:10px; font-weight:bold;"></p>

<div class="backup-box">
<button class="backup-btn" id="exportBtn">📤 تصدير</button>
<button class="backup-btn" id="importBtn">📥 استيراد</button>
<input type="file" id="importInput" accept=".json" hidden>
</div>

<button class="toggle-index-btn" id="toggleIndexBtn">📂 إظهار الفهرس</button>

<div class="notes-list" id="notesList">
<div class="search-box"><input type="text" id="searchInput" placeholder="🔍 ابحث في الملاحظات..."></div>
<div id="notesContainer">⏳ جاري التحميل...</div>
</div>
</div>

<div class="floating">
<button onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️</button>
<button onclick="scrollFirst()">🔝</button>
<button onclick="scrollLast()">🔚</button>
<button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">⬇️</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg = { apiKey: "AIzaSyBrXDy3FuN6YJlIYTWCD_TsfMvkmiWZiLo", authDomain: "hassanmedication.firebaseapp.com", projectId: "hassanmedication", storageBucket: "hassanmedication.firebasestorage.app", messagingSenderId: "1023452446639", appId: "1:1023452446639:web:dedf54f7ff5c4c93d9795a" };
const db = getFirestore(initializeApp(cfg));
let notes = [], search = '', editId = null;

const $ = id => document.getElementById(id);
$('toggleIndexBtn').onclick = () => { $('notesList').classList.toggle('visible'); $('toggleIndexBtn').innerText = $('notesList').classList.contains('visible') ? '📂 إخفاء الفهرس' : '📂 إظهار الفهرس'; };
$('searchInput').oninput = e => { search = e.target.value.toLowerCase(); render(); };
window.scrollFirst = () => { const f = document.querySelector('.note-card'); if(f) f.scrollIntoView({behavior:'smooth', block:'center'}); };
window.scrollLast = () => { const a = document.querySelectorAll('.note-card'); if(a.length) a[a.length-1].scrollIntoView({behavior:'smooth', block:'center'}); };

async function load() {
    const s = await getDocs(collection(db, "notes"));
    notes = [];
    s.forEach(d => notes.push({id: d.id, ...d.data()}));
    // الترتيب: المثبتة أولاً، ثم الأحدث (الرقم الأكبر أولاً)
    notes.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0) || (b.order || 0) - (a.order || 0));
    render();
}

function render() {
    let f = notes.filter(n => (n.text || '').toLowerCase().includes(search));
    $('notesContainer').innerHTML = f.map(n => `
    <div class="note-card ${n.isPinned ? 'pinned' : ''}">
        <div class="note-header">${n.isPinned ? '📌' : ''} 📅 ${new Date(n.timestamp || 0).toLocaleString('ar-EG')}</div>
        <div class="note-text">${n.text || ''}</div>
        <div class="btn-group">
            <button class="action-btn" onclick="window.edit('${n.id}')">✏️ تعديل</button>
            <button class="action-btn" onclick="window.pin('${n.id}', ${n.isPinned || false})">${n.isPinned ? '📌 إلغاء' : '📌 تثبيت'}</button>
            <button class="action-btn" onclick="window.move('${n.id}', 1)">⬆️ رفع</button>
            <button class="action-btn" onclick="window.move('${n.id}', -1)">⬇️ إنزال</button>
            <button class="action-btn delete-btn" onclick="window.del('${n.id}')">🗑️ حذف</button>
        </div>
    </div>`).join('') || '<p style="text-align:center">لا توجد ملاحظات</p>';
}

$('saveBtn').onclick = async () => {
    const t = $('noteInput').value.trim();
    if(!t) return;
    if(editId) {
        await setDoc(doc(db, "notes", editId), {text: t, timestamp: Date.now()}, {merge: true});
        editId = null; $('saveBtn').innerText = '💾 حفظ على السحابة';
    } else {
        // هنا نضع Date.now() للملاحظة الجديدة لتظهر في الأعلى
        await setDoc(doc(collection(db, "notes")), {text: t, timestamp: Date.now(), isPinned: false, order: Date.now()});
    }
    $('noteInput').value = ''; load();
};

window.del = async (id) => { if(confirm('حذف؟')) { await deleteDoc(doc(db, "notes", id)); load(); } };
window.pin = async (id, p) => { await setDoc(doc(db, "notes", id), {isPinned: !p, order: Date.now()}, {merge: true}); load(); };
window.edit = (id) => { const n = notes.find(x => x.id === id); $('noteInput').value = n.text; editId = id; $('saveBtn').innerText = '✏️ تحديث'; $('noteInput').scrollIntoView({behavior:'smooth'}); };

// دالة الرفع والإنزال
window.move = async (id, dir) => {
    const i = notes.findIndex(x => x.id === id);
    if(dir === 1 && i > 0) {
        await setDoc(doc(db, "notes", id), {order: (notes[i-1].order || 0) + 1}, {merge: true});
    } else if(dir === -1 && i < notes.length - 1) {
        await setDoc(doc(db, "notes", id), {order: (notes[i+1].order || 0) - 1}, {merge: true});
    }
    load();
};

$('exportBtn').onclick = () => {
    const b = new Blob([JSON.stringify(notes)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'notes.json'; a.click();
};

$('importBtn').onclick = () => $('importInput').click();
$('importInput').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async (ev) => {
        try {
            const d = JSON.parse(ev.target.result);
            for(let n of (Array.isArray(d) ? d : d.notes || [])) {
                await setDoc(doc(collection(db, "notes")), {text: n.text || '', timestamp: n.timestamp || Date.now(), isPinned: n.isPinned || false, order: n.order || Date.now()});
            }
            load();
        } catch(err) { alert('خطأ في الملف'); }
    };
    r.readAsText(f);
};

load();
</script>
</body>
</html>
