<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBrXDy3FuN6YJlIYTWCD_TsfMvkmiWZiLo",
    authDomain: "hassanmedication.firebaseapp.com",
    projectId: "hassanmedication",
    storageBucket: "hassanmedication.firebasestorage.app",
    messagingSenderId: "1023452446639",
    appId: "1:1023452446639:web:dedf54f7ff5c4c93d9795a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let notes = [];

async function loadNotes() {
    const snap = await getDocs(collection(db, "notes"));
    notes = [];
    snap.forEach(d => notes.push({ id: d.id, ...d.data() }));
    notes.sort((a, b) => {
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;
        return (b.order || 0) - (a.order || 0);
    });
    renderNotes();
}

function renderNotes() {
    const container = document.getElementById('notesDiv');
    const term = document.getElementById('searchBox').value.toLowerCase();
    const filtered = notes.filter(n => (n.text||'').toLowerCase().includes(term));

    if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;">لا توجد ملاحظات</p>';
        return;
    }

    container.innerHTML = filtered.map(n => `
        <div class="note ${n.isPinned ? 'pinned' : ''}">
            <p>${n.text || ''}</p>
            <div class="actions">
                <button onclick="editNote('${n.id}')">✏️ تعديل</button>
                <button onclick="pinNote('${n.id}', ${n.isPinned || false})">${n.isPinned ? '📌 إلغاء' : '📌 تثبيت'}</button>
                <button onclick="moveNote('${n.id}', 1)">⬆️ رفع</button>
                <button onclick="moveNote('${n.id}', -1)">⬇️ إنزال</button>
                <button onclick="deleteNote('${n.id}')" style="color:red;">🗑️ حذف</button>
            </div>
        </div>
    `).join('');
}

window.saveNote = async () => {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return alert('اكتب ملاحظة أولاً!');
    await setDoc(doc(collection(db, "notes")), {
        text: text, timestamp: Date.now(), isPinned: false, order: Date.now()
    });
    document.getElementById('textInput').value = '';
    await loadNotes();
    alert('تم الحفظ!');
};

window.deleteNote = async (id) => {
    if (confirm('حذف الملاحظة؟')) {
        await deleteDoc(doc(db, "notes", id));
        await loadNotes();
    }
};

window.pinNote = async (id, currentPin) => {
    await setDoc(doc(db, "notes", id), { isPinned: !currentPin }, { merge: true });
    await loadNotes();
};

window.editNote = (id) => {
    const note = notes.find(n => n.id === id);
    document.getElementById('textInput').value = note.text;
    document.getElementById('saveBtn').innerText = '✏️ تحديث';
    document.getElementById('saveBtn').onclick = async () => {
        const newText = document.getElementById('textInput').value.trim();
        await setDoc(doc(db, "notes", id), { text: newText }, { merge: true });
        document.getElementById('saveBtn').innerText = '💾 حفظ';
        document.getElementById('saveBtn').onclick = window.saveNote;
        document.getElementById('textInput').value = '';
        await loadNotes();
        alert('تم التحديث!');
    };
};

window.moveNote = async (id, dir) => {
    const idx = notes.findIndex(n => n.id === id);
    if (dir === 1 && idx > 0) {
        await setDoc(doc(db, "notes", id), { order: (notes[idx-1].order || 0) + 1 }, { merge: true });
    } else if (dir === -1 && idx < notes.length - 1) {
        await setDoc(doc(db, "notes", id), { order: (notes[idx+1].order || 0) - 1 }, { merge: true });
    }
    await loadNotes();
};

window.toggleList = () => {
    document.getElementById('listDiv').classList.toggle('hidden');
};

window.scrollFirst = () => {
    const first = document.querySelector('.note');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.scrollLast = () => {
    const all = document.querySelectorAll('.note');
    if (all.length) all[all.length-1].scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.exportData = () => {
    const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'notes-backup.json';
    a.click();
};

window.importData = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const data = JSON.parse(e.target.result);
            const list = Array.isArray(data) ? data : (data.notes || []);
            for (let n of list) {
                await setDoc(doc(collection(db, "notes")), {
                    text: n.text || '', timestamp: n.timestamp || Date.now(), isPinned: n.isPinned || false, order: n.order || Date.now()
                });
            }
            await loadNotes();
            alert('تم الاستيراد بنجاح!');
        } catch (err) { alert('خطأ في قراءة الملف'); }
    };
    reader.readAsText(file);
};

loadNotes();
</script>
</body>
</html>
