<!-- أضف هذا الكود تماماً تحت زر الحفظ #saveBtn -->
<div style="background: var(--paper-card); border: 2px solid var(--paper-border); border-radius: 8px; padding: 20px; margin-top: 20px; text-align: center;">
    <h3 style="margin-bottom: 15px; color: var(--ink-dark); border-bottom: 1px dashed var(--paper-border); padding-bottom: 8px;">المسبحة الإلكترونية</h3>
    <div id="tasbeehDisplay" style="font-size: 48px; font-weight: bold; color: var(--primary); margin: 15px 0;">0</div>
    <div style="display: flex; gap: 10px; justify-content: center;">
        <button id="countBtn" style="background: var(--primary); color: #fff; flex: 2; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;">+1 سبّح</button>
        <button id="resetBtn" style="background: transparent; color: var(--danger); border: 1px solid var(--danger); flex: 1; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;">تصفير</button>
    </div>
</div>

<script>
    (function() {
        const display = document.getElementById('tasbeehDisplay');
        const countBtn = document.getElementById('countBtn');
        const resetBtn = document.getElementById('resetBtn');

        let count = parseInt(localStorage.getItem('tasbeehCount')) || 0;
        if (display) display.textContent = count;

        if (countBtn) {
            countBtn.addEventListener('click', () => {
                count++;
                if (display) display.textContent = count;
                localStorage.setItem('tasbeehCount', count);
            });
        }

        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (confirm('هل تريد تصفير العداد؟')) {
                    count = 0;
                    if (display) display.textContent = count;
                    localStorage.setItem('tasbeehCount', 0);
                }
            });
        }
    })();
</script>
